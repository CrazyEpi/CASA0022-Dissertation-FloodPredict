<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="73.3mm" height="39.6mm" viewBox="0 0 73.3 39.6">
  <title>Flood ETA VU Dial</title>
  <desc>1:1 printable VU replacement dial. Ticks sit near the top of the visible 30 mm area; numbers and caption sit below the sweep.</desc>
  <defs>
    <style>
      .face { fill: #f3e39a; }
      .edge { fill: none; stroke: #cbbd75; stroke-width: 0.18; }
      .cutline { fill: none; stroke: #8a8a8a; stroke-width: 0.10; stroke-dasharray: 0.9 0.55; vector-effect: non-scaling-stroke; }
      .arc-red { fill: none; stroke: #a90f17; stroke-width: 2.15; stroke-linecap: butt; stroke-linejoin: round; }
      .arc-black { fill: none; stroke: #111111; stroke-width: 2.15; stroke-linecap: butt; stroke-linejoin: round; }
      .tick { stroke: #111111; stroke-width: 0.76; stroke-linecap: butt; }
      .tick-small { stroke: #111111; stroke-width: 0.46; stroke-linecap: butt; }
      .tick-red { stroke: #a90f17; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 4.0px; font-weight: 800; letter-spacing: 0; text-anchor: middle; dominant-baseline: middle; fill: #111111; }
      .label-red { fill: #a90f17; }
      .caption { font-family: Arial, Helvetica, sans-serif; font-size: 2.55px; font-weight: 800; letter-spacing: 0; text-anchor: middle; fill: #111111; }
    </style>
  </defs>

  <path id="dial-outline-fill" class="face"
        d="M0 0 L73.3 0 L73.3 29.5 L72.2 29.5 L72.2 34.6 L58.5 34.6 L58.5 39.6 L45.7 39.6 C44.9 34.7 41.4 31.2 36.65 31.2 C31.9 31.2 28.4 34.7 27.6 39.6 L15 39.6 L15 34.6 L1.2 34.6 L1.2 30.3 L0 30.3 Z"/>
  <path id="dial-outline-edge" class="edge"
        d="M0 0 L73.3 0 L73.3 29.5 L72.2 29.5 L72.2 34.6 L58.5 34.6 L58.5 39.6 L45.7 39.6 C44.9 34.7 41.4 31.2 36.65 31.2 C31.9 31.2 28.4 34.7 27.6 39.6 L15 39.6 L15 34.6 L1.2 34.6 L1.2 30.3 L0 30.3 Z"/>

